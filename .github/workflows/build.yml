name: Build and push image

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build.yml"

permissions:
  id-token: write # mint the OIDC token
  contents: read # checkout

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name ${{ vars.ACR_LOGIN_SERVER }}

      - name: Build image
        run: docker build -t ${{ vars.ACR_LOGIN_SERVER }}/fastapi-app:${{ github.sha }} ./app

      - name: Push image
        run: docker push ${{ vars.ACR_LOGIN_SERVER }}/fastapi-app:${{ github.sha }}

  bump-manifest:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: write #push the bump branch
      pull-requests: write #open the PR
    steps:
      - uses: actions/checkout@v4

      - name: Bump image tag in deploy manifest
        run: |
          sed -i "s|image: .*azurecr.io/.*|image: ${{ vars.ACR_NAME }}.azurecr.io/fastapi-app:${{ github.sha }}|" deploy/deployment.yaml

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="deploy/bump-${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add deploy/deployment.yaml
          git commit -m "Deploy fastapi-app:${GITHUB_SHA::7}"
          git push origin "$BRANCH"
          gh pr create \
            --title "Deploy fastapi-app:${GITHUB_SHA::7}" \
            --body "Automated image bump from CI run ${{ github.run_id }}. Merging this PR is the deployment: Flux reconciles the cluster to match." \
            --base main
