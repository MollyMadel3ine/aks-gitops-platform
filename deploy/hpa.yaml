# Scales demo-app on CPU utilization, measured against the 50m request.
# minReplicas keep the same floor, the manifest's replicas: 2 used to set;
# maxReplicas is bounded by the single node's capacity
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: demo-app
  namespace: demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: demo-app
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70