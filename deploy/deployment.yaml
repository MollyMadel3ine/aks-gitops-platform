# Demo workload: public nginx image so the Flux loop is proven in isolation -
# no image-pull auth in the failure surface. The container-iac FastAPI app
# (from ACR, via the AcrPull wiring) replaces this in phase 3
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
