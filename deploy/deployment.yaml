# Demo workload: public nginx image so the Flux loop is proven in isolation -
# no image-pull auth in the failure surface. 
# container-iac FastAPI app from the shared ACR - pulled via the kubelet
# identity's AcrPull grant (see infra/main.tf)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: app
          image: acrcontainerdemomolly.azurecr.io/container-demo:861de1303f910f63c2b3f6e0444e284e30c4c6b2
          ports:
            - containerPort: 8000
