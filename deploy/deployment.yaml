# Demo workload: public nginx image so the Flux loop is proven in isolation -
# no image-pull auth in the failure surface. 
# container-iac FastAPI app from the shared ACR - pulled via the kubelet
# identity's AcrPull grant (see infra/main.tf)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: app
          image: .azurecr.io/fastapi-app:00d560e9724564ecbca08c05e39f53dcd8c077d5
          ports:
            - containerPort: 8000
