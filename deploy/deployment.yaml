# Demo workload: public nginx image so the Flux loop is proven in isolation -
# no image-pull auth in the failure surface. 
# container-iac FastAPI app from the shared ACR - pulled via the kubelet
# identity's AcrPull grant (see infra/main.tf)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: app
          image: acrcontainerdemomolly.azurecr.io/fastapi-app:2b0a15314f21b248e397b27fae6f5af04672057c
          ports:
            - containerPort: 8000
          # Requests from observed idle usage (2m CPU, 47Mi) plus headroom.
          # CPU request sized so HPA utilization is meaningful under load.
          # Memory limit caps leaks; no CPU limit, to avoid throttling.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          # Readiness gates traffic: a pod joins the Service only once /health
          # responds, so rolling updates never route to a starting pod.
          # Liveness restarts a hung process; it checks only the app itself.
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3 